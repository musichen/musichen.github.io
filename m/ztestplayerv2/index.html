<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple MP3 Player</title>
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* General styling */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222;
            color: #fff;
            overflow: hidden;
        }

        /* Particles background */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Player container */
        .player {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .player h2 {
            margin: 0 0 20px;
        }

        /* Playlist styling */
        .playlist {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
            list-style-type: none;
            padding: 0;
        }

        .playlist li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }

        .playlist li.active {
            background: #444;
            font-weight: bold;
        }

        /* Controls styling */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 10px 0;
        }

        .controls .material-icons {
            cursor: pointer;
            font-size: 24px;
            color: #f7b733;
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: #444;
            border-radius: 3px;
            margin: 10px 0;
        }

        .progress {
            height: 100%;
            width: 0;
            background: #f7b733;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="player">
        <h2>MP3 Player</h2>
        <ul class="playlist" id="playlist">
            <!-- Songs list generated here by JavaScript -->
        </ul>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="controls">
            <span class="material-icons" id="back">skip_previous</span>
            <span class="material-icons" id="play">play_arrow</span>
            <span class="material-icons" id="pause" style="display:none;">pause</span>
            <span class="material-icons" id="stop">stop</span>
            <span class="material-icons" id="next">skip_next</span>
            <span class="material-icons" id="shuffle">shuffle</span>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let songs = ["1.mp3", "2.mp3"];  // Update with your actual filenames
        let currentSongIndex = 0;
        let isShuffle = false;

        // Load and display songs in the playlist
        function loadPlaylist() {
            const playlistElement = document.getElementById('playlist');
            playlistElement.innerHTML = '';
            songs.forEach((song, index) => {
                const songElement = document.createElement('li');
                songElement.innerText = song.replace('.mp3', '');
                songElement.onclick = () => playSong(index);
                playlistElement.appendChild(songElement);
            });
        }

        function init() {
            loadPlaylist();
            loadSong(currentSongIndex);
            updatePlaylistDisplay();
        }

        function loadSong(index) {
            audio.src = `music/${songs[index]}`;
            updatePlaylistDisplay();
        }

        function playSong(index) {
            currentSongIndex = index;
            loadSong(index);
            audio.play();
            document.getElementById('play').style.display = 'none';
            document.getElementById('pause').style.display = 'inline';
        }

        audio.ontimeupdate = () => {
            const progress = document.getElementById('progress');
            progress.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        };

        document.getElementById('play').onclick = () => audio.play();
        document.getElementById('pause').onclick = () => audio.pause();
        document.getElementById('stop').onclick = () => { audio.pause(); audio.currentTime = 0; };
        document.getElementById('next').onclick = () => playSong(isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex + 1) % songs.length);
        document.getElementById('back').onclick = () => playSong((currentSongIndex - 1 + songs.length) % songs.length);
        document.getElementById('shuffle').onclick = () => isShuffle = !isShuffle;
        audio.onended = () => document.getElementById('next').click();

        audio.onplay = () => {
            document.getElementById('play').style.display = 'none';
            document.getElementById('pause').style.display = 'inline';
        };

        audio.onpause = () => {
            document.getElementById('pause').style.display = 'none';
            document.getElementById('play').style.display = 'inline';
        };

        init();
        
        // ParticlesJS Config
        particlesJS.load('particles-js', 'https://cdn.jsdelivr.net/particles.js/2.0.0/particlesjs-config.json');
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASH colors Mixer</title>

<style>
:root{
  --bg:#0b1220;
  --card:#0f172a;
  --muted:#9aa4b2;
  --accent:#7dd3fc;
  --error:#ff6b6b;
}
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(1200px 600px at 20% -10%,#0b1b3a,#040812);
  color:#e6f0ff;padding:24px;
  display:flex;justify-content:center
}
.wrap{width:1200px;max-width:98%}
h1{margin:0}
.lead{margin:6px 0 14px;color:var(--muted);font-size:13px}

.card{
  background:linear-gradient(180deg,#0d162b,#081021);
  padding:18px;border-radius:14px;
  border:1px solid rgba(255,255,255,.04);
  box-shadow:0 12px 40px rgba(0,0,0,.7)
}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{
  background:#101a33;border:1px solid rgba(255,255,255,.06);
  color:var(--accent);padding:8px 14px;border-radius:10px;
  cursor:pointer;font-weight:600
}
.btn.small{padding:6px 10px;font-size:13px}
.badge{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted)}

.inputs{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}

.color-row{display:grid;grid-template-columns:44px 120px repeat(3,70px) auto;gap:8px;align-items:center}
.swatch{width:44px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.06);cursor:pointer}
input{
  background:#050b1a;color:#e6f0ff;
  border:1px solid rgba(255,255,255,.06);
  border-radius:8px;padding:6px 8px;
  font-weight:600
}
input[type=number]{text-align:center}
label{font-size:11px;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.panel{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);
  padding:14px;border-radius:12px
}
.final-swatch{height:72px;border-radius:10px;border:1px solid rgba(255,255,255,.05);margin:10px 0}
pre{background:#020617;padding:12px;border-radius:8px;font-size:13px;color:#cfeefb;line-height:1.5}
footer{margin-top:10px;color:var(--muted);font-size:13px}
</style>
</head>

<body>
<div class="wrap">
  <h1>HASH colors Mixer</h1>
  <p class="lead">HEX & RGB inputs are fully synchronized. Includes full calculation walkthrough.</p>

  <div class="card">
    <div class="controls">
      <button class="btn small" id="addBtn">+ Add</button>
      <button class="btn small" id="removeBtn">− Remove</button>
      <span class="badge" id="countBadge">2 / 30</span>
      <button class="btn" id="mixBtn">Mix</button>
      <button class="btn small" id="randomBtn">Randomize</button>
    </div>

    <div class="inputs" id="inputs"></div>

    <div class="grid">
      <div class="panel">
        <strong>Final result</strong>
        <div id="finalSwatch" class="final-swatch"></div>
        <div><strong id="finalHex"></strong></div>
        <div id="finalRGB" class="lead"></div>
        <pre id="bashCode"></pre>
      </div>
      <div class="panel">
        <strong>Calculation walkthrough</strong>
        <pre id="calcSteps"></pre>
      </div>
    </div>

    <footer>Equal-weight RGB averaging • Fully auditable math</footer>
  </div>
</div>

<script>
(() => {
const MAX=30, MIN=2;
const inputs=document.getElementById('inputs');
const badge=document.getElementById('countBadge');

const clamp=v=>Math.min(255,Math.max(0,Math.round(v)));
const rgbToHex=(r,g,b)=>[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
const hexToRgb=h=>({
  r:parseInt(h.slice(0,2),16),
  g:parseInt(h.slice(2,4),16),
  b:parseInt(h.slice(4,6),16)
});
const normalizeHex=v=>{
  if(!v) return null;
  v=v.replace('#','').toUpperCase();
  if(v.length>6) v=v.slice(0,6);
  if(/^[0-9A-F]{3}$/.test(v)) v=v.split('').map(c=>c+c).join('');
  return /^[0-9A-F]{6}$/.test(v)?v:null;
};

function row(hex){
  const r=document.createElement('div');
  r.className='color-row';

  const sw=document.createElement('div');
  sw.className='swatch';

  const picker=document.createElement('input');
  picker.type='color'; picker.style.display='none';

  const hexInput=document.createElement('input');
  hexInput.placeholder='HEX';

  const rIn=document.createElement('input');
  const gIn=document.createElement('input');
  const bIn=document.createElement('input');
  [rIn,gIn,bIn].forEach(i=>{i.type='number';i.min=0;i.max=255});

  function setRGB(r,g,b){
    r=clamp(r);g=clamp(g);b=clamp(b);
    const h=rgbToHex(r,g,b);
    sw.style.background='#'+h;
    picker.value='#'+h;
    hexInput.value=h;
    rIn.value=r; gIn.value=g; bIn.value=b;
  }

  const init=hex?hexToRgb(hex):{r:100,g:100,b:100};
  setRGB(init.r,init.g,init.b);

  sw.onclick=()=>picker.click();
  picker.oninput=e=>{
    const rgb=hexToRgb(normalizeHex(e.target.value));
    setRGB(rgb.r,rgb.g,rgb.b);
  };

  hexInput.oninput=()=>{
    const h=normalizeHex(hexInput.value);
    if(h){ const rgb=hexToRgb(h); setRGB(rgb.r,rgb.g,rgb.b); }
  };

  [rIn,gIn,bIn].forEach(()=>{});
  rIn.oninput=gIn.oninput=bIn.oninput=()=>{
    setRGB(+rIn.value,+gIn.value,+bIn.value);
  };

  r.append(sw,hexInput,rIn,gIn,bIn,picker);
  return r;
}

const count=()=>inputs.children.length;
const updateBadge=()=>badge.textContent=`${count()} / ${MAX}`;
const add=h=>{if(count()<MAX){inputs.appendChild(row(h));updateBadge();}};
const remove=()=>{if(count()>MIN){inputs.lastChild.remove();updateBadge();}};

function mix(){
  const list=[...inputs.children].map(r=>{
    const i=r.querySelectorAll('input');
    return {r:+i[1].value,g:+i[2].value,b:+i[3].value};
  });
  const n=list.length;
  const sr=list.reduce((s,c)=>s+c.r,0);
  const sg=list.reduce((s,c)=>s+c.g,0);
  const sb=list.reduce((s,c)=>s+c.b,0);
  const ar=Math.round(sr/n), ag=Math.round(sg/n), ab=Math.round(sb/n);
  const hex=rgbToHex(ar,ag,ab);

  finalSwatch.style.background='#'+hex;
  finalHex.textContent='#'+hex;
  finalRGB.textContent=`rgb(${ar}, ${ag}, ${ab})`;
  bashCode.textContent=`export HASH_COLOR="#${hex}"
printf "\\033[48;2;${ar};${ag};${ab}m  \\033[0m\\n"`;

  calcSteps.textContent=
`RED: (${list.map(c=>c.r).join(' + ')}) / ${n} = ${sr}/${n} ≈ ${ar}
GREEN: (${list.map(c=>c.g).join(' + ')}) / ${n} = ${sg}/${n} ≈ ${ag}
BLUE: (${list.map(c=>c.b).join(' + ')}) / ${n} = ${sb}/${n} ≈ ${ab}

Final RGB = (${ar}, ${ag}, ${ab})
Final HEX = #${hex}`;
}

add('993F00');
add('4C005C');
updateBadge();
mix();

addBtn.onclick=()=>add();
removeBtn.onclick=remove;
mixBtn.onclick=mix;
randomBtn.onclick=()=>{
  [...inputs.children].forEach(r=>{
    const r0=Math.random()*255|0,g0=Math.random()*255|0,b0=Math.random()*255|0;
    r.querySelectorAll('input')[1].value=r0;
    r.querySelectorAll('input')[2].value=g0;
    r.querySelectorAll('input')[3].value=b0;
  });
  mix();
};
})();
</script>
</body>
</html>

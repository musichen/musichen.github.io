<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            max-width: 315px; /* Ensuring it fits nicely on mobile screens */
            margin: 0 auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #eee;
            border: 1px solid #999;
            font-size: 50px;
            text-align: center;
            line-height: 100px;
            cursor: pointer;
        }
        .cell:hover, .cell:active {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="board"></div>
    <p id="status"></p>

    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        let currentPlayer = 'X';
        let gameState = ['', '', '', '', '', '', '', '', ''];

        // Initialize the board
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.setAttribute('data-index', i); // Add index as data attribute for touch events
            cell.addEventListener('click', handleMove);
            cell.addEventListener('touchstart', handleTouchStart);
            board.appendChild(cell);
        }

        function handleMove(e) {
            const index = Number(e.target.getAttribute('data-index'));
            makeMove(index);
        }

        function handleTouchStart(e) {
            e.preventDefault(); // Prevent the touch event from scrolling the page
            const touch = e.touches[0];
            const cell = document.elementFromPoint(touch.clientX, touch.clientY);
            if (cell && cell.classList.contains('cell')) {
                const index = Number(cell.getAttribute('data-index'));
                makeMove(index);
            }
        }

        function makeMove(index) {
            if (gameState[index] === '' && !checkWinner()) {
                gameState[index] = currentPlayer;
                board.children[index].textContent = currentPlayer;
                if (checkWinner()) {
                    status.textContent = `Player ${currentPlayer} wins!`;
                    disableBoard();
                } else if (!gameState.includes('')) {
                    status.textContent = "It's a draw!";
                    disableBoard();
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    status.textContent = `Player ${currentPlayer}'s turn`;
                }
            }
        }

        function checkWinner() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            return winPatterns.some(pattern => 
                pattern.every(index => gameState[index] === currentPlayer)
            );
        }

        function disableBoard() {
            for (let cell of board.children) {
                cell.removeEventListener('click', handleMove);
                cell.removeEventListener('touchstart', handleTouchStart);
            }
        }

        // Start the game
        status.textContent = `Player ${currentPlayer}'s turn`;
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Game with Timer and Touch Support</title>
    <style>
        /* Previous styles remain the same */
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls input {
            width: 80px;
            margin: 0 5px;
            padding: 5px;
        }
        .controls button {
            margin: 0 5px;
            padding: 5px 15px;
            cursor: pointer;
        }
        canvas {
            display: block;
            background-color: #FFFFFF;
            border: 1px solid #ccc;
        }
        #score {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <input type="number" id="boxWidth" placeholder="Width" value="800">
        <input type="number" id="boxHeight" placeholder="Height" value="600">
        <button onclick="setBoxSize()">Set Box Size</button>
        <button onclick="restart()">Restart</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="score">Time: 0.0s</div>

    <script>
        // Get reference to the canvas element and its 2D rendering context
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        // Define the game area dimensions based on canvas size
        var SCREEN_WIDTH = canvas.width;
        var SCREEN_HEIGHT = canvas.height;

        // Define game object dimensions
        var wallThickness = 10;  // Thickness of border walls
        var ballRadius = 15;     // Radius of the player ball

        // Set initial ball position at bottom center of screen
        var ballPos = { 
            x: SCREEN_WIDTH / 2,  // Center horizontally
            y: SCREEN_HEIGHT - wallThickness - ballRadius  // Bottom, accounting for wall and ball size
        };

        // Ball velocity vector - starts at 0
        var ballVel = { x: 0, y: 0 };

        // Physics constants
        var gravity = 0.5;       // Downward acceleration
        var friction = 0.99;     // Air resistance (1 = no friction, 0 = maximum friction)
        var accelAmount = 1;     // How much keyboard/touch input affects ball speed
        var bounceEnergy = 0.8;  // How much energy remains after bouncing (1 = perfect bounce, 0 = no bounce)

        // Game state variables
        var timer = 0;              // Tracks time ball stays in air
        var hasStartedMoving = false;  // Whether player has made first move
        var timerStopped = false;      // Whether timer has been stopped due to wall collision
        var lastTimestamp = 0;         // For calculating time between frames

        // Touch input tracking
        var touchStart = { x: 0, y: 0 };  // Starting position of touch
        var minSwipeDistance = 30;        // Minimum pixels needed for swipe detection
        var keys = {};                    // Tracks which keyboard keys are pressed

        // Function to handle box size changes from UI
        function setBoxSize() {
            var width = parseInt(document.getElementById('boxWidth').value);
            var height = parseInt(document.getElementById('boxHeight').value);
            
            // Only update if dimensions are valid
            if (width > 0 && height > 0) {
                canvas.width = width;
                canvas.height = height;
                SCREEN_WIDTH = width;
                SCREEN_HEIGHT = height;
                resetBall();  // Reset ball position for new dimensions
            }
        }

        // Function to restart the game
        function restart() {
            timer = 0;             // Reset timer
            hasStartedMoving = false;  // Reset movement flag
            timerStopped = false;      // Enable timer
            document.getElementById('score').textContent = 'Time: 0.0s';  // Reset score display
            resetBall();              // Reset ball position
        }

        // Function to reset ball to starting position
        function resetBall() {
            ballPos = { 
                x: SCREEN_WIDTH / 2,  // Center horizontally
                y: SCREEN_HEIGHT - wallThickness - ballRadius  // Bottom position
            };
            ballVel = { x: 0, y: 0 };  // Stop all movement
        }

        // Function to stop timer and display final score
        function stopTimer() {
            if (!timerStopped) {  // Only stop once
                timerStopped = true;
                document.getElementById('score').textContent = `Final Time: ${timer.toFixed(1)}s`;
            }
        }

        // Event listener for keyboard press
        window.addEventListener('keydown', function(e) {
            keys[e.keyCode] = true;  // Mark key as pressed
            // Start game on first arrow key press
            if (!hasStartedMoving && (e.keyCode >= 37 && e.keyCode <= 40)) {
                hasStartedMoving = true;
            }
        }, false);

        // Event listener for keyboard release
        window.addEventListener('keyup', function(e) {
            keys[e.keyCode] = false;  // Mark key as released
        }, false);

        // Event listener for touch start
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();  // Prevent scrolling
            touchStart.x = e.touches[0].clientX;  // Record touch position
            touchStart.y = e.touches[0].clientY;
        }, false);

        // Event listener for touch end (swipe detection)
        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            // Get touch end position
            var touchEnd = {
                x: e.changedTouches[0].clientX,
                y: e.changedTouches[0].clientY
            };

            // Calculate swipe distance
            var dx = touchEnd.x - touchStart.x;
            var dy = touchEnd.y - touchStart.y;

            // If swipe is long enough to count
            if (Math.abs(dx) > minSwipeDistance || Math.abs(dy) > minSwipeDistance) {
                if (!hasStartedMoving) {
                    hasStartedMoving = true;  // Start game on first swipe
                }
                
                // Determine swipe direction and apply force
                if (Math.abs(dx) > Math.abs(dy)) {  // Horizontal swipe
                    if (dx > 0) {  // Right swipe
                        ballVel.x += accelAmount * 5;
                    } else {      // Left swipe
                        ballVel.x -= accelAmount * 5;
                    }
                } else {  // Vertical swipe
                    if (dy > 0) {  // Down swipe
                        ballVel.y += accelAmount * 5;
                    } else {      // Up swipe
                        ballVel.y -= accelAmount * 5;
                    }
                }
            }
        }, false);

        // Function to check if ball is touching any wall
        function checkWallCollision() {
            return (
                ballPos.x - ballRadius <= wallThickness ||             // Left wall
                ballPos.x + ballRadius >= SCREEN_WIDTH - wallThickness ||  // Right wall
                ballPos.y - ballRadius <= wallThickness ||             // Top wall
                ballPos.y + ballRadius >= SCREEN_HEIGHT - wallThickness    // Bottom wall
            );
        }

        // Main game loop
        function gameLoop(timestamp) {
            if (lastTimestamp === 0) {
                lastTimestamp = timestamp;  // Initialize first frame
            }
            const deltaTime = (timestamp - lastTimestamp) / 1000;  // Convert to seconds
            lastTimestamp = timestamp;

            update(deltaTime);  // Update game state
            draw();            // Draw frame
            requestAnimationFrame(gameLoop);  // Queue next frame
        }

        // Update game state
        function update(deltaTime) {
            if (hasStartedMoving) {  // Only update if game has started
                // Apply keyboard controls
                if (keys[37]) ballVel.x -= accelAmount;  // Left arrow
                if (keys[39]) ballVel.x += accelAmount;  // Right arrow
                if (keys[38]) ballVel.y -= accelAmount;  // Up arrow
                if (keys[40]) ballVel.y += accelAmount;  // Down arrow

                // Apply gravity
                ballVel.y += gravity;

                // Update position based on velocity
                ballPos.x += ballVel.x;
                ballPos.y += ballVel.y;

                // Apply air resistance
                ballVel.x *= friction;
                ballVel.y *= friction;

                // Check for wall collision and stop timer if needed
                if (checkWallCollision()) {
                    stopTimer();
                }

                // Update timer if still running
                if (!timerStopped) {
                    timer += deltaTime;
                    document.getElementById('score').textContent = `Time: ${timer.toFixed(1)}s`;
                }

                // Handle wall collisions with bounce
                if (ballPos.x - ballRadius < wallThickness) {  // Left wall
                    ballVel.x = Math.abs(ballVel.x) * bounceEnergy;  // Bounce right
                    ballPos.x = wallThickness + ballRadius + 1;      // Prevent sticking
                } else if (ballPos.x + ballRadius > SCREEN_WIDTH - wallThickness) {  // Right wall
                    ballVel.x = -Math.abs(ballVel.x) * bounceEnergy;  // Bounce left
                    ballPos.x = SCREEN_WIDTH - wallThickness - ballRadius - 1;
                }

                if (ballPos.y - ballRadius < wallThickness) {  // Top wall
                    ballVel.y = Math.abs(ballVel.y) * bounceEnergy;  // Bounce down
                    ballPos.y = wallThickness + ballRadius + 1;
                } else if (ballPos.y + ballRadius > SCREEN_HEIGHT - wallThickness) {  // Bottom wall
                    ballVel.y = -Math.abs(ballVel.y) * bounceEnergy;  // Bounce up
                    ballPos.y = SCREEN_HEIGHT - wallThickness - ballRadius - 1;
                }

                // Stop ball if moving very slowly (prevent endless tiny movements)
                if (Math.abs(ballVel.x) < 0.1) ballVel.x = 0;
                if (Math.abs(ballVel.y) < 0.1) ballVel.y = 0;
            }
        }

        // Draw game objects
        function draw() {
            // Clear previous frame
            ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            // Draw walls
            ctx.fillStyle = '#000000';
            // Left wall
            ctx.fillRect(0, 0, wallThickness, SCREEN_HEIGHT);
            // Right wall
            ctx.fillRect(SCREEN_WIDTH - wallThickness, 0, wallThickness, SCREEN_HEIGHT);
            // Top wall
            ctx.fillRect(0, 0, SCREEN_WIDTH, wallThickness);
            // Bottom wall
            ctx.fillRect(0, SCREEN_HEIGHT - wallThickness, SCREEN_WIDTH, wallThickness);

            // Draw ball
            ctx.beginPath();
            ctx.arc(ballPos.x, ballPos.y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.closePath();
        }

        // Start the game
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

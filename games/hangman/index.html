<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        /* CSS Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .game-container {
            width: 80%;
            height: 80vh;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .header {
            text-align: center;
            font-size: 24px;
            padding: 10px;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            Play Hangman Game
        </div>
        <iframe src="about:blank" id="gameFrame"></iframe>
    </div>

    <script>
        // JavaScript to dynamically load the game URL into the iframe
        window.onload = function() {
            var iframe = document.getElementById('gameFrame');
            // Embedding the Hangman game from the provided URL
            iframe.src = 'https://hangman-backend.coolmathgames.com/';
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <!-- Include necessary libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* styles.css */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s;
        }

        li:hover {
            background-color: #e9e9e9;
        }

        .task-text {
            flex-grow: 1;
            margin-right: 10px;
            transition: text-decoration 0.3s, color 0.3s;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        /* Export buttons styling */
        .export-buttons {
            margin-top: 20px;
        }

        .export-buttons button {
            background-color: #007bff;
        }

        .export-buttons button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button id="addTaskButton">Add Task</button>
        <ul id="taskList"></ul>

        <!-- Export Buttons -->
        <div class="export-buttons">
            <button id="exportPdfButton">Export List as PDF</button>
            <button id="exportPngButton">Export List as PNG</button>
        </div>
    </div>

    <script>
        // JavaScript code
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('taskInput');
            const addTaskButton = document.getElementById('addTaskButton');
            const taskList = document.getElementById('taskList');

            // Load tasks from local storage
            loadTasks();

            // Add task event listener
            addTaskButton.addEventListener('click', addTask);

            // Function to add a task
            function addTask() {
                const taskText = taskInput.value.trim();
                if (taskText === '') return;

                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';

                const taskSpan = document.createElement('span');
                taskSpan.className = 'task-text';
                taskSpan.textContent = taskText;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';

                li.appendChild(checkbox);
                li.appendChild(taskSpan);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);

                // Save tasks to local storage
                saveTasks();

                // Clear input field
                taskInput.value = '';

                // Event listeners for checkbox and delete button
                checkbox.addEventListener('change', toggleTaskCompletion);
                deleteBtn.addEventListener('click', deleteTask);
            }

            // Function to toggle task completion
            function toggleTaskCompletion(e) {
                const taskText = e.target.nextElementSibling;
                if (e.target.checked) {
                    taskText.classList.add('completed');
                } else {
                    taskText.classList.remove('completed');
                }
                saveTasks();
            }

            // Function to delete a task
            function deleteTask(e) {
                const li = e.target.parentElement;
                taskList.removeChild(li);
                saveTasks();
            }

            // Function to save tasks to local storage
            function saveTasks() {
                const tasks = [];
                for (const li of taskList.children) {
                    const taskText = li.querySelector('.task-text').textContent;
                    const isCompleted = li.querySelector('.task-checkbox').checked;
                    tasks.push({ taskText, isCompleted });
                }
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            // Function to load tasks from local storage
            function loadTasks() {
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                for (const { taskText, isCompleted } of tasks) {
                    const li = document.createElement('li');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'task-checkbox';
                    checkbox.checked = isCompleted;

                    const taskSpan = document.createElement('span');
                    taskSpan.className = 'task-text';
                    taskSpan.textContent = taskText;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete';

                    li.appendChild(checkbox);
                    li.appendChild(taskSpan);
                    li.appendChild(deleteBtn);

                    if (isCompleted) {
                        taskSpan.classList.add('completed');
                    }

                    taskList.appendChild(li);

                    // Event listeners for checkbox and delete button
                    checkbox.addEventListener('change', toggleTaskCompletion);
                    deleteBtn.addEventListener('click', deleteTask);
                }
            }

            // Export to PDF functionality
            document.getElementById('exportPdfButton').addEventListener('click', () => {
                const element = document.getElementById('taskList'); // Get the task list
                const opt = {
                    margin: 10,
                    filename: 'todo-list.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save();
            });

            // Export to PNG functionality
            document.getElementById('exportPngButton').addEventListener('click', () => {
                const element = document.getElementById('taskList'); // Get the task list
                html2canvas(element).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imgData;
                    link.download = 'todo-list.png';
                    link.click();
                });
            });
        });
    </script>
</body>
</html>
